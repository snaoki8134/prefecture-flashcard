<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>都道府県章フラッシュカード</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#243447;--muted:#6b7785;--accent:#3b82f6;--line:#dbe3ec}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eef5ff,#f8fafc);color:var(--ink)}
.app{max-width:900px;margin:auto;padding:18px 16px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:clamp(20px,4vw,30px);margin:0;font-weight:800}.small{color:var(--muted);font-size:13px}
.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px rgba(40,70,100,.07)}
.modebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.modebtn{padding:16px 10px;border-radius:15px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:17px;cursor:pointer}
.modebtn.active{border-color:var(--accent);background:#eff6ff;color:#1d4ed8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:9px;background:#e8edf3;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:24px;min-height:490px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:0 14px 40px rgba(40,70,100,.09)}
.label{font-size:15px;color:var(--muted);margin-bottom:10px}.emblem-wrap{width:min(72vw,390px);height:min(55vw,300px);display:flex;align-items:center;justify-content:center}.emblem{max-width:100%;max-height:100%;object-fit:contain}
.answer{font-size:clamp(30px,7vw,54px);font-weight:800;letter-spacing:.04em;text-align:center;min-height:75px;display:flex;align-items:center;justify-content:center}.hidden{visibility:hidden}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}button{border:0;border-radius:15px;padding:15px 12px;font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}
.primary{background:var(--accent);color:#fff}.ok{background:#dcfce7;color:#166534}.ng{background:#fee2e2;color:#991b1b}.secondary{background:#eef2f7;color:#334155}button:disabled{opacity:.42;cursor:not-allowed}
.bottom{display:flex;gap:10px;margin-top:12px}.bottom button{flex:1;font-size:14px;padding:12px}.result{text-align:center;padding:28px 10px}.result h2{font-size:30px;margin:0 0 8px}.score{font-size:42px;font-weight:900;margin:10px 0}.note{color:var(--muted);line-height:1.7}
.history{margin-top:14px}.history h3{margin:0 0 8px}.history-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:13px}.history-row:last-child{border-bottom:0}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:999px;padding:5px 9px;font-size:12px}
@media(max-width:600px){.app{padding:12px}.card{min-height:430px;padding:18px}.actions{gap:9px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const KEY="prefectureFlashcardRecordsV2";
let records=loadRecords(), deck=[],index=0,wrong=[],answered=false,revealed=false,currentMode="ordered",sessionCorrect=0,sessionWrong=0;

function loadRecords(){try{return JSON.parse(localStorage.getItem(KEY))||{sessions:[],weak:{},streak:0,best:0}}catch(e){return{sessions:[],weak:{},streak:0,best:0}}}
function saveRecords(){localStorage.setItem(KEY,JSON.stringify(records))}
function updateStats(){
 document.getElementById("totalSessions").textContent=records.sessions.length;
 document.getElementById("bestScore").textContent=records.best?records.best+" / 47":"—";
 document.getElementById("streak").textContent=records.streak||0;
 document.getElementById("weakCount").textContent=Object.keys(records.weak).length;
 renderRecordPanel();
}
function renderRecordPanel(){
 const p=document.getElementById("recordPanel"), s=records.sessions.slice(-8).reverse();
 let weak=Object.entries(records.weak).sort((a,b)=>b[1]-a[1]).slice(0,8);
 p.innerHTML=`<h3>📊 学習記録</h3>
 ${s.length?s.map(x=>`<div class="history-row"><span>${x.date}　${x.mode}</span><strong>${x.correct} / ${x.total}</strong></div>`).join(""):`<div class="small">まだ学習記録はありません。</div>`}
 ${weak.length?`<div class="small" style="margin-top:12px"><strong>最近よく間違えている県</strong></div><div class="weak">${weak.map(x=>`<span class="chip">${x[0]} ×${x[1]}</span>`).join("")}</div>`:""}`;
}
function setMode(mode){
 currentMode=mode;
 document.getElementById("orderedMode").classList.toggle("active",mode==="ordered");
 document.getElementById("randomMode").classList.toggle("active",mode==="random");
 start(ALL_CARDS,mode==="random"?"ランダム・全47問":"順序どおり・全47問",false);
}
function start(cards,label,isRetry=false){
 deck=cards.map(c=>({...c})); if(currentMode==="random"&&!isRetry) deck.sort(()=>Math.random()-.5);
 index=0;wrong=[];answered=false;revealed=false;sessionCorrect=0;sessionWrong=0;
 document.getElementById("mode").textContent=label;render();
}
function render(){
 if(index>=deck.length){finish();return}
 const c=deck[index];document.getElementById("count").textContent=`${index+1} / ${deck.length}`;document.getElementById("bar").style.width=`${index/deck.length*100}%`;
 document.getElementById("game").innerHTML=`<div class="card"><div class="label">この県章は、何県？</div><div class="emblem-wrap"><img class="emblem" src="${c.image}" alt="都道府県章"></div><div class="answer ${revealed?'':'hidden'}">${c.name}</div></div>
 <div class="actions"><button class="primary" id="revealBtn">👀 答えを見る</button><button class="secondary" id="nextBtn" disabled>次へ →</button></div>
 <div class="actions"><button class="ok" id="okBtn" disabled>⭕ OK（合っていた）</button><button class="ng" id="ngBtn" disabled>❌ ×（まちがえた）</button></div>`;
 document.getElementById("revealBtn").onclick=reveal;document.getElementById("okBtn").onclick=()=>judge(true);document.getElementById("ngBtn").onclick=()=>judge(false);document.getElementById("nextBtn").onclick=next;
}
function reveal(){revealed=true;document.querySelector(".answer").classList.remove("hidden");document.getElementById("revealBtn").disabled=true;document.getElementById("okBtn").disabled=false;document.getElementById("ngBtn").disabled=false}
function judge(correct){if(answered)return;answered=true;if(correct)sessionCorrect++;else{sessionWrong++;wrong.push(deck[index]);records.weak[deck[index].name]=(records.weak[deck[index].name]||0)+1;saveRecords();updateStats()}document.getElementById("okBtn").disabled=true;document.getElementById("ngBtn").disabled=true;document.getElementById("nextBtn").disabled=false}
function next(){index++;answered=false;revealed=false;render()}
function finish(){
 document.getElementById("bar").style.width="100%";document.getElementById("count").textContent=`${deck.length} / ${deck.length}`;
 const pct=Math.round(sessionCorrect/deck.length*100);
 if(deck.length===47){records.sessions.push({date:new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}),mode:currentMode==="random"?"ランダム":"順序どおり",correct:sessionCorrect,total:deck.length});if(records.sessions.length>50)records.sessions.shift();if(sessionCorrect>records.best)records.best=sessionCorrect;records.streak=wrong.length?0:records.streak+sessionCorrect;saveRecords();updateStats()}
 document.getElementById("game").innerHTML=`<div class="panel result"><h2>${wrong.length?"おつかれさま！":"🎉 全問クリア！"}</h2><div class="score">${sessionCorrect} / ${deck.length}</div><div class="note">正答率 ${pct}%<br>${wrong.length?`まちがえた問題は <strong>${wrong.length}問</strong> です。`:"まちがえた問題はありません！"}</div><div class="bottom">${wrong.length?'<button class="ng" id="wrongBtn">❌ まちがえた問題だけ</button>':""}<button class="primary" id="againBtn">🔄 もう一度</button></div></div>`;
 if(wrong.length)document.getElementById("wrongBtn").onclick=()=>start(wrong,`まちがえた${wrong.length}問`,true);
 document.getElementById("againBtn").onclick=()=>start(ALL_CARDS,currentMode==="random"?"ランダム・全47問":"順序どおり・全47問",false);
}
document.getElementById("orderedMode").onclick=()=>setMode("ordered");
document.getElementById("randomMode").onclick=()=>setMode("random");
document.getElementById("resetBtn").onclick=()=>{if(confirm("この端末に保存されている学習記録も含めて、最初からやり直しますか？")){records={sessions:[],weak:{},streak:0,best:0};saveRecords();updateStats();start(ALL_CARDS,"順序どおり・全47問",false)}};
updateStats();start(ALL_CARDS,"順序どおり・全47問",false);
</script>
</body>
